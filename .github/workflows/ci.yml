name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (${{ matrix.os }}, Python 3.13)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Obtener el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar el kit con sus extras y las dependencias de desarrollo
        run: python -m pip install -e ".[particion,comparacion,dev]"

      - name: Ruff (reglas)
        run: python -m ruff check .

      - name: Ruff (formato)
        run: python -m ruff format --check .

      - name: Mypy (estricto)
        run: python -m mypy

      - name: Pruebas con cobertura del 100 %
        run: python -m pytest --cov-report=xml:coverage.xml --cov-report=term-missing

      - name: Publicar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-${{ matrix.os }}
          path: coverage.xml
          if-no-files-found: ignore
